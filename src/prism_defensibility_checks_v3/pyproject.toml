[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-defensibility-checks"
version = "0.1.0"
description = "Defensibility checks for PRISM Condorcet/model tournament experiments"
requires-python = ">=3.9"
dependencies = [
    "datasets>=2.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_checks*"]
